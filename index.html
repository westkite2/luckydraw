  :root{color-scheme:dark;--bg:#090808;--text:#fff;--muted:#b1a5a7;--subtle:#a19799;--accent:#ff5460;--launch-pink:linear-gradient(165deg,#ff646d 0%,#ed394b 52%,#c32338 100%);--ink:#240508;--font:"Pretendard","Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",system-ui,sans-serif;--mono:ui-monospace,"Cascadia Mono",Consolas,monospace}
  *,*::before,*::after{box-sizing:border-box}
  body{margin:0;min-width:280px;min-height:100vh;min-height:100svh;background:radial-gradient(ellipse 65% 32% at 50% 1%,#200d11 0%,transparent 88%),var(--bg);color:var(--text);font-family:var(--font);-webkit-font-smoothing:antialiased;display:flex;flex-direction:column}
  button,textarea{font:inherit}button{cursor:pointer}button:disabled{cursor:default}button:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:4px}svg{flex-shrink:0}
  .shell{width:min(1120px,calc(100% - 72px));margin-inline:auto}
  .top{border-bottom:1px solid #ffffff12}
  .top-inner{min-height:73px;display:flex;align-items:center;justify-content:space-between;gap:16px}
  .top-actions,.entry-count,.upload{display:flex;align-items:center}
  .brand{min-width:0;flex:1;color:#fff;font-size:clamp(17px,2.45vw,25px);font-weight:850;line-height:1.14;letter-spacing:-.045em}
  .brand .red{color:var(--accent)}
  .brand .phrase{display:inline-block;white-space:nowrap}
  .top-actions{gap:12px;flex-shrink:0}
  .entry-count{gap:7px;color:var(--muted);font-size:12px;white-space:nowrap}
  .entry-count strong{color:var(--text);font:700 13px var(--mono);font-variant-numeric:tabular-nums}
  .upload{justify-content:center;gap:8px;min-height:38px;padding:0 13px;border-radius:9px;border:1px solid #45373a;background:#181415;color:var(--text);font-size:12px;font-weight:750;white-space:nowrap;transition:background .15s,border-color .15s}
  .upload:hover:not(:disabled){background:#291c20;border-color:#70565b}.upload:disabled{opacity:.46}
  main{width:min(690px,calc(100% - 48px));margin:auto;display:flex;flex-direction:column;align-items:center;padding:48px 0 45px}
  .intro{text-align:center;margin-bottom:36px}
  .eyebrow{display:flex;align-items:center;justify-content:center;gap:10px;margin:0 0 13px;color:var(--accent);font:750 11px/1.35 var(--mono);letter-spacing:.18em;white-space:nowrap}
  .eyebrow .star{font-family:"Segoe UI Symbol","Apple Symbols",system-ui,sans-serif;font-size:13px;line-height:1;letter-spacing:0}
  h1{margin:0;color:#fff;font-size:clamp(33px,6.4vw,63px);line-height:1.08;letter-spacing:-.038em;word-break:keep-all}
  .title-letters{font-weight:800}
  .machine{width:100%;padding:clamp(8px,1.5vw,14px);border:1px solid #463035;border-radius:clamp(15px,2.4vw,22px);background:linear-gradient(160deg,#21181a 0%,#171214 72%);box-shadow:0 14px 34px #0007,inset 0 1px 0 #ffffff0b}
  .viewport{--step:clamp(70px,12vw,96px);position:relative;isolation:isolate;overflow:hidden;height:calc(var(--step) * 2 + 15px);border:1px solid #492e35;border-radius:12px;background:linear-gradient(180deg,#100c0e,#120e10 50%,#100c0e);box-shadow:0 3px 14px #0005}
  .selection{z-index:0;position:absolute;top:50%;left:0;right:0;height:var(--step);transform:translateY(-50%);border-block:1px solid #7b3544;pointer-events:none;background:linear-gradient(90deg,#35191e,#32181d 50%,#35191e);box-shadow:inset 0 1px 0 #ffffff08;transition:border-color .25s}
  .selection::before,.selection::after{position:absolute;content:"";top:50%;width:7px;height:7px;border-top:1px solid var(--accent);border-right:1px solid var(--accent);opacity:.75}
  .selection::before{left:15px;transform:translateY(-50%) rotate(45deg)}.selection::after{right:15px;transform:translateY(-50%) rotate(225deg)}
  .track-mask{position:absolute;z-index:1;inset:0;pointer-events:none;contain:layout paint}
  .viewport::before,.viewport::after{content:"";position:absolute;z-index:2;inset:0;border-radius:inherit;pointer-events:none}
  .viewport::before{box-shadow:inset 0 10px 19px -9px #000b,inset 0 -10px 19px -9px #000b,inset 10px 0 18px -13px #0009,inset -10px 0 18px -13px #0009}
  .viewport::after{background:linear-gradient(180deg,#100c0e 0%,#100c0e00 27%,#100c0e00 73%,#100c0e 100%)}
  .track{position:absolute;top:50%;left:0;right:0;height:0}
  .machine[data-state="spinning"] .track{will-change:transform}
  .reel-cell{position:absolute;left:25px;right:25px;height:var(--step);display:flex;align-items:center;justify-content:center;font-weight:850;line-height:1;letter-spacing:-.045em;color:#fff5f6}
  .reel-name{display:block;min-width:0;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:pre;text-align:center;line-height:1.12;unicode-bidi:plaintext}
  .machine[data-state="done"] .selection{background:linear-gradient(90deg,#481d26,#3d1921 50%,#481d26);border-color:#a04555;box-shadow:inset 0 1px 0 #ff879124}
  .machine[data-state="empty"] .reel-cell.is-center{color:#b8afb3}
  .machine[data-state="done"] .reel-cell.is-center{text-shadow:0 0 23px #ff53654a}
  .controls{width:100%;margin-top:31px;text-align:center}
  .draw-btn{position:relative;isolation:isolate;display:block;width:clamp(118px,21vw,156px);aspect-ratio:1;margin-inline:auto;padding:0;border:1px solid #55353b;border-radius:50%;background:linear-gradient(145deg,#392b2d,#171113 55%,#100c0d);box-shadow:0 4px 0 #090607,0 13px 30px #0009,inset 0 1px 2px #ffffff24;touch-action:manipulation}
  .draw-btn::before{content:"";position:absolute;inset:6px;border-radius:50%;background:#14080b;box-shadow:0 1px 1px #ff9da52b,inset 0 4px 9px #000c}
  .draw-face{position:absolute;inset:11px;display:grid;place-items:center;border:1px solid #ff8c94;border-radius:50%;background:radial-gradient(ellipse at 37% 12%,#ffabb28a,transparent 64%),var(--launch-pink);color:#fff;font-size:clamp(18px,2.5vw,23px);font-weight:850;letter-spacing:-.035em;text-shadow:0 1px 2px #6f0c19a0;transform:translateY(-7px);box-shadow:0 3px 0 #b02134,0 8px 0 #791626,0 11px 12px #0008,inset 0 2px 2px #ffdddf82,inset 0 -5px 11px #8f182c52;transition:transform .13s ease-out,box-shadow .13s ease-out,filter .13s ease-out}
  .draw-btn:hover:not(:disabled) .draw-face{filter:brightness(1.08)}
  .draw-btn:focus-visible{outline-offset:5px}
  .draw-btn:active:not(:disabled) .draw-face,.draw-btn.is-spinning .draw-face{transform:translateY(2px);box-shadow:0 1px 0 #731827,0 2px 5px #0009,inset 0 2px 8px #8f1a2a6b;filter:brightness(.93)}

'use strict';

  const $ = id => document.getElementById(id);
  const MAX_NAMES = 1000, DURATION = 7000;
  const EMPTY_LABEL = '후보자 명단을 등록해 주세요';
  const STANDBY_LABEL = 'LUCKY DRAW';

  const cells = Array.from(track.children);
  const upload = $('upload'), draw = $('draw'), drawLabel = $('draw-label');
  const announcement = $('announcement'), hint = $('hint'), fullWinner = $('full-winner');
  const dialog = $('dialog'), names = $('names'), error = $('error');

  const segmenter = typeof Intl.Segmenter === 'function' ? new Intl.Segmenter('ko', {granularity:'grapheme'}) : null;

  const fontContext = document.createElement('canvas').getContext('2d');
  const fontFamily = getComputedStyle(cells[0]).fontFamily;
  const fontWeight = getComputedStyle(cells[0]).fontWeight;
  const sizes = new Map();
  const randomWord = new Uint32Array(1);
  const RANGE = 0x100000000;
  let candidates = [], reel = [], selected = null, winner = null;
  let spinning = false, center = 0, fraction = 0, step = 96, nameWidth = 600;
  let lastPaintedIndex = -1;

  cells.forEach((cell, index) => { cell.style.top = `calc(var(--step) * ${index - 2.5})`; });
  const mod = (i, n) => ((i % n) + n) % n;

  // For long lists, let the early rush fall off sooner while keeping a gradual final glide.
  // All three terms share the same clock; their derivative sets the click intensity.
  function makeReelMotion(distance, candidateCount) {
    const ratio = Math.max(0, Math.min(1, (candidateCount - 30) / 570));
    const blend = 1 - (1 - ratio) ** 2;
    const glide = Math.min(45, distance * .24) * blend;
    const rush = distance * blend - glide;
    const classic = distance * (1 - blend);
    const glidePower = 2.1;
    return t => {
      const u = 1 - t;
      const u2 = u * u, u3 = u2 * u, u4 = u2 * u2, u7 = u3 * u4;
      const glideRate = u ** (glidePower - 1);
      const remaining = classic * u4 + rush * u7 * u + glide * glideRate * u;
      const speed = (4 * classic * u3 + 8 * rush * u7 + glidePower * glide * glideRate) * 1000 / DURATION;
      return {traveled:Math.max(0, distance - remaining), speed};
    };
  }

  function makeDrawSound() {
    let audio, output, clickBuffer, spin, chime;

    function init() {
      if (audio) return audio;
      const AudioEngine = globalThis.AudioContext || globalThis.webkitAudioContext;
      if (!AudioEngine) return null;
      const ctx = new AudioEngine({latencyHint:'interactive'});
      const master = ctx.createGain();
      master.gain.value = .78;
      master.connect(ctx.destination);
      const buffer = ctx.createBuffer(1, Math.ceil(ctx.sampleRate * .047), ctx.sampleRate);
      const waveform = buffer.getChannelData(0);
      let previousNoise = 0;
      for (let i = 0; i < waveform.length; i++) {
        const t = i / ctx.sampleRate;
        const noise = Math.random() * 2 - 1;
        const attack = Math.min(1, t / .0014);
        const grit = .5 * (noise - .56 * previousNoise);
        const ring = .31 * Math.sin(2 * Math.PI * 760 * t) + .15 * Math.sin(2 * Math.PI * 1510 * t);
        waveform[i] = (grit + ring) * attack * Math.exp(-t * 118) * Math.min(1, (.047 - t) / .005);
        previousNoise = noise;
      }
      clickBuffer = buffer;
      output = master;
      audio = ctx;
      return audio;
    }

    function bus() {
      const gain = audio.createGain();
      gain.connect(output);
      return gain;
    }

    function release(gain) {
      if (!gain) return;
      const now = audio.currentTime;
      gain.gain.setValueAtTime(1, now);
      gain.gain.linearRampToValueAtTime(0, now + .025);
      setTimeout(() => gain.disconnect(), 60);
    }

    function tick(at, destination, speed, accented) {
      const source = audio.createBufferSource();
      const level = audio.createGain();
      source.buffer = clickBuffer;
      source.playbackRate.value = .81 + .3 * speed + (accented ? .04 : 0);
      level.gain.value = (.13 + .18 * speed) * (accented ? 1.22 : 1);
      source.connect(level);
      level.connect(destination);
      source.start(at);
    }

    function start() {
      try {
        const ctx = init();
        if (!ctx) return;
        release(chime);
        chime = null;
        const session = {lastCenter: 0, lastClickAt: -Infinity, count: 0, bus: null};
        spin = session;
        const ready = () => {
          if (spin === session && ctx.state === 'running') session.bus = bus();
        };
        // Unlock on the button's user gesture without delaying the animation.
        if (ctx.state === 'running') ready();
        else ctx.resume().then(ready).catch(() => {});
      } catch { /* Audio is optional on unsupported or restricted browsers. */ }
    }

    function move(traveled, rowsPerSecond) {
      const session = spin;
      if (!session) return;
      // The closest row to the center changes halfway between two row positions.
      const centeredRow = Math.floor(traveled + .5);
      if (centeredRow <= session.lastCenter) return;
      session.lastCenter = centeredRow;
      if (!session.bus || audio.state !== 'running') return;
      const now = audio.currentTime;
      // At full speed one frame can advance many rows; never queue missed clicks.
      if (now - session.lastClickAt < .026) return;
      try {
        const speed = Math.min(1, Math.sqrt(rowsPerSecond / 48));
        tick(now + .004, session.bus, speed, session.count++ % 3 === 0);
        session.lastClickAt = now;
      } catch { /* Keep rendering if the audio device becomes unavailable. */ }
    }

    function bell(at, destination, hz, strength, length) {
      for (const [ratio, mix, decay] of [[1, 1, 1], [2.003, .18, .52], [3.01, .055, .32]]) {
        const tone = audio.createOscillator();
        const envelope = audio.createGain();
        const end = at + length * decay;
        tone.type = 'sine';
        tone.frequency.value = hz * ratio;
        envelope.gain.setValueAtTime(.0001, at);
        envelope.gain.linearRampToValueAtTime(strength * mix, at + .009);
        envelope.gain.exponentialRampToValueAtTime(strength * mix * .33, at + length * decay * .36);
        envelope.gain.exponentialRampToValueAtTime(.0001, end);
        tone.connect(envelope);
        envelope.connect(destination);
        tone.start(at);
        tone.stop(end + .01);
      }
    }

    function finish() {
      const current = spin;
      spin = null;
      try {
        release(current?.bus);
        if (!audio || audio.state !== 'running') return;
        const out = bus();
        chime = out;
        const at = audio.currentTime + .015;
        // A quick rising pickup opens into one bright, sustained major chord.
        [523.25, 659.25, 783.99].forEach((note, i) => bell(at + .048 * i, out, note, .082, .39));
        const chordAt = at + .145;
        [[261.63, .11], [523.25, .084], [659.25, .077], [783.99, .089], [1046.50, .11]]
          .forEach(([note, gain], i) => bell(chordAt + .007 * i, out, note, gain, 1.14));
        setTimeout(() => {
          if (chime === out) chime = null;
          out.disconnect();

      } catch { /* The winner remains confirmed even if playback is unavailable. */ }
    }

  }

  // Discard the incomplete tail before taking a remainder, so every index is equally likely.
  function uniformInt(n) {
    if (n === 1) return 0;
    const ceiling = RANGE - RANGE % n;
    do { crypto.getRandomValues(randomWord); } while (randomWord[0] >= ceiling);
    return randomWord[0] % n;
  }

    const copy = entries.slice();
    for (let i = copy.length - 1; i > 0; i--) {
      const j = uniformInt(i + 1);
      [copy[i], copy[j]] = [copy[j], copy[i]];
    }
    return copy;
  }

  function parse(value) {
    const entries = [];
    const lines = value.split(/\r\n|[\n\r\u2028\u2029]/u);
    let count = 0;
    for (let i = 0; i < lines.length; i++) {
      const name = lines[i].trim();
      if (!name) continue;
      count++;
      if (count <= MAX_NAMES) entries.push({name});
    }
    const issue = count > MAX_NAMES ? `후보자는 최대 ${number.format(MAX_NAMES)}명까지 등록할 수 있습니다.` : '';
    return {entries, count, issue};
  }
  function checkEditor(report = false) {
    const parsed = parse(names.value);
    $('edit-count').textContent = `${number.format(parsed.count)} / ${number.format(MAX_NAMES)}명`;
    const issue = report || names.getAttribute('aria-invalid') === 'true' ? parsed.issue : '';
    error.textContent = issue;
    names.setAttribute('aria-invalid', String(Boolean(issue)));
    return parsed;
  }

  function reelLabel(name) {
    const known = sizes.get(name);
    if (known !== undefined) return known;
    const max = Math.floor(Math.min(68, step * .72));
    const min = Math.min(max, 15);
    // Keep the complete entry; bound only the text measuring and frame rendering work.
    let text = name.slice(0, 512).replace(/[\uD800-\uDBFF]$/u, '');
    let shortened = text.length < name.length;
    const measure = (value, px) => {
      fontContext.font = fontWeight + ' ' + px + 'px ' + fontFamily;
      return fontContext.measureText(value).width;
    };
    const measured = measure(text, max);
    let fit = Math.max(min, Math.min(max, Math.floor(max * nameWidth / Math.max(1, measured))));
    while (fit > min && measure(text, fit) > nameWidth) fit--;
    if (shortened || measure(text, fit) > nameWidth) {
      const chars = segmenter ? Array.from(segmenter.segment(text), part => part.segment) : Array.from(text);
      let lo = 0, hi = chars.length;
      while (lo < hi) {
        const mid = Math.ceil((lo + hi) / 2);
        if (measure(chars.slice(0, mid).join('') + '…', fit) <= nameWidth) lo = mid;
        else hi = mid - 1;
      }
      text = chars.slice(0, lo).join('') + '…';
      shortened = true;
    }
    const label = {text, fit, shortened};
    sizes.set(name, label);
    return label;
  }
  function syncWinnerControl() {
    fullWinner.hidden = !(winner && reelLabel(winner.name).shortened);
  }
  function paint(index, part = 0, force = false) {
    center = index;
    fraction = part;
    track.style.transform = `translate3d(0,${Math.round(part * step * 10) / 10}px,0)`;
    const replace = force || lastPaintedIndex !== index;
    for (let i = 0; i < cells.length; i++) {
      const cell = cells[i], offset = i - 2;
      if (replace) {
        const entry = reel.length ? reel[mod(index + offset, reel.length)] : null;
        const instruction = !entry && offset === 0 && !candidates.length;
        const value = entry?.name ?? (offset === 0 ? (instruction ? EMPTY_LABEL : STANDBY_LABEL) : '');
        const label = value ? reelLabel(value) : null;
        labels[i].textContent = instruction ? EMPTY_LABEL : (label?.text ?? '');
        cell.style.fontSize = label ? (instruction ? `min(${label.fit}px, clamp(15px, 3.5vw, 28px))` : `${label.fit}px`) : '';
        cell.classList.toggle('is-center', offset === 0);
      }
      const focus = Math.max(0, 1 - Math.abs(offset + part));
      cell.style.opacity = String(Math.round((.38 + .62 * focus) * 100) / 100);
    }
    lastPaintedIndex = index;
  }
  function resize() {
    const height = cells[0].getBoundingClientRect().height;
    const width = cells[0].clientWidth - 6;
    if (height === step && width === nameWidth) return;
    step = height;
    nameWidth = Math.max(1, width);
    sizes.clear();
    paint(center, fraction, true);
    syncWinnerControl();
  }
  function setState(state, message) {
    const busy = state === 'spinning';
    const complete = state === 'done';
    machine.dataset.state = state;
    draw.disabled = busy || !candidates.length;
    upload.disabled = busy;
    draw.classList.toggle('is-spinning', busy);
    drawLabel.textContent = busy ? '추첨 중…' : '돌리기';
    hint.textContent = message;
    hint.classList.toggle('is-winner', complete);
    syncWinnerControl();
    announcement.textContent = complete ? (fullWinner.hidden ? `최종 당첨자: ${winner.name}` : '최종 당첨자가 확정되었습니다. 전체 이름 보기 버튼에서 확인하세요.') : state === 'empty' ? EMPTY_LABEL : message;
  }
  function setCandidates(entries) {
    candidates = entries;
    reel = [];
    selected = winner = null;
    $('count').textContent = number.format(entries.length);
    sizes.clear();
    paint(0, 0, true);
    if (entries.length) setState('ready', `${entries.length}명이 등록되었습니다. 돌리기를 눌러 추첨하세요.`);
    else setState('empty', '');
  }
  upload.addEventListener('click', () => {
    if (spinning || dialog.open) return;
    names.value = candidates.map(entry => entry.name).join('\n');
    names.setAttribute('aria-invalid', 'false');
    checkEditor();
    dialog.showModal();
    names.focus();
  });
  $('close').addEventListener('click', () => dialog.close());
  $('cancel').addEventListener('click', () => dialog.close());
  fullWinner.addEventListener('click', () => {
    if (!winner || winnerDialog.open) return;
    winnerName.textContent = winner.name;
    winnerDialog.showModal();
    winnerName.scrollTop = 0;
  });
  $('winner-close').addEventListener('click', () => winnerDialog.close());
  winnerDialog.addEventListener('close', () => { winnerName.textContent = ''; });
  names.addEventListener('input', () => checkEditor());
  $('editor').addEventListener('submit', event => {
    event.preventDefault();
    if (spinning || !dialog.open) return;
    const parsed = checkEditor(true);
    if (parsed.issue) { names.focus(); return; }
    setCandidates(parsed.entries);
    dialog.close();
    upload.focus();
  });

  draw.addEventListener('click', () => {
    if (spinning || !candidates.length || dialog.open) return;
    const restoreFocus = document.activeElement === draw;
    const n = candidates.length;
    // Choose the winner directly from the full list before laying out the visual reel.
    const picked = candidates[uniformInt(n)];
    reel = shuffle(candidates);
    const start = selected ? reel.indexOf(selected) : 0;
    const landing = reel.indexOf(picked);
    // At least three complete laps in the timeline, with enough travel for tiny lists.
    const laps = Math.max(3, Math.ceil(84 / n));
    const distance = laps * n + mod(start - landing, n);
    const still = reduceMotion.matches;
    spinning = true;
    winner = null;
    paint(start, 0, true);
    setState('spinning', '후보자 중 당첨자를 뽑고 있습니다.');
    drawSound.start();
    const started = performance.now();
    const motion = makeReelMotion(distance, n);
    function frame(now) {
      const t = Math.max(0, Math.min(1, (now - started) / DURATION));
      if (t >= 1) {
        selected = winner = picked;
        paint(landing, 0, true);
        spinning = false;
        setState('done', '최종 당첨자가 확정되었습니다!');
        drawSound.finish();
        if (restoreFocus && (document.activeElement === document.body || document.activeElement === draw)) draw.focus({preventScroll:true});
        return;
      }
      if (!still) {
        // Monotonic ease-out: constant direction, fast start, speed approaches zero.
        const {traveled, speed} = motion(t);
        const whole = Math.floor(traveled);
        paint(mod(start - whole, n), traveled - whole);
        drawSound.move(traveled, speed);
      }
      requestAnimationFrame(frame);
    }
    requestAnimationFrame(frame);
  });
  paint(0, 0, true);
  resize();
  new ResizeObserver(resize).observe(viewport);
})();
</script>
</body>
</html>
